<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-BIT STUDY HUB // QUEST LOG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0c10'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23141622' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M5 5h6v2H7v2h3v2H7v2H5V5z' fill='%2339ff14'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0c10'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23141622' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M5 5h6v2H7v2h3v2H7v2H5V5z' fill='%2339ff14'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #141622;
      --panel-alt: #1c1f30;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --cyan: #00f0ff;
      --green: #39ff14;
      --gold: #ffd700;
      --magenta: #ff2a85;
      --border: #2e344e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      line-height: 1.4;
      padding: 20px 14px 60px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 999;
    }

    .container { max-width: 1120px; margin: 0 auto; }

    .pixel-box {
      background: var(--panel);
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0px #000000;
      padding: 18px;
      margin-bottom: 22px;
    }

    /* Header HUD */
    header.hud {
      border-color: var(--cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hud-title h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 2.6vw, 1.4rem);
      color: var(--cyan);
      text-shadow: 3px 3px 0px #004455;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .hud-sub { color: var(--green); font-size: 1.2rem; }

    .hud-stats { display: flex; gap: 12px; flex-wrap: wrap; }

    .stat-badge {
      background: var(--panel-alt);
      border: 2px solid var(--gold);
      padding: 8px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: var(--gold);
      box-shadow: 3px 3px 0 #000;
    }

    /* Layout Grid */
    .main-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .section-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 16px;
      text-shadow: 2px 2px 0 #000;
    }

    /* Course Folder Tabs */
    .folder-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .folder-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      background: var(--panel-alt);
      color: var(--muted);
      border: 2px solid var(--border);
      padding: 9px 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
    }

    .folder-btn.active {
      background: var(--cyan);
      color: #000;
      border-color: #fff;
    }

    .pixel-input {
      width: 100%;
      background: #08090d;
      border: 2px solid var(--cyan);
      color: var(--green);
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      padding: 10px 12px;
      margin-bottom: 18px;
      outline: none;
    }

    /* Quest Cards Grid */
    .quest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .quest-card {
      display: block;
      text-decoration: none;
      background: var(--panel-alt);
      border: 3px solid var(--border);
      padding: 16px;
      color: var(--text);
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s, border-color 0.1s;
    }

    .quest-card:hover {
      border-color: var(--green);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .quest-tag {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      background: #08090d;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 4px 7px;
      margin-bottom: 10px;
    }

    .quest-card h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.76rem;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .quest-card p { color: var(--muted); font-size: 1.15rem; }

    /* Calendar Styling */
    .cal-box { border-color: var(--magenta); }

    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: var(--panel-alt);
      padding: 8px 10px;
      border: 2px solid var(--border);
    }

    .cal-nav button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      background: var(--magenta);
      color: #fff;
      border: 2px solid #fff;
      padding: 6px 10px;
      cursor: pointer;
    }

    .cal-month-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #fff;
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-weekdays div {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      color: var(--cyan);
      padding: 6px 0;
    }

    .cal-day {
      background: var(--panel-alt);
      border: 2px solid var(--border);
      padding: 8px 2px;
      cursor: pointer;
      position: relative;
      font-size: 1.2rem;
      user-select: none;
    }

    .cal-day:hover { border-color: var(--cyan); }
    .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-day.today { border-color: var(--green); color: var(--green); font-weight: bold; }
    .cal-day.selected { background: #2b193d; border-color: var(--magenta); }

    .cal-day.has-event::after {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--magenta);
      box-shadow: 0 0 6px var(--magenta);
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Simple Add Exam Form (No Subject Dropdown) */
    .event-form {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-form input {
      background: #08090d;
      border: 2px solid var(--border);
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      padding: 8px 10px;
      width: 100%;
    }

    .add-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      background: var(--green);
      color: #000;
      border: 2px solid #fff;
      padding: 11px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
    }

    /* Exam List */
    .event-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 270px;
      overflow-y: auto;
    }

    .event-item {
      background: #08090d;
      border-left: 4px solid var(--magenta);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .event-meta {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .event-title { font-size: 1.2rem; color: #fff; }

    .del-btn {
      background: transparent;
      border: 1px solid var(--magenta);
      color: var(--magenta);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 5px 7px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TOP HUD -->
    <header class="pixel-box hud">
      <div class="hud-title">
        <h1>UTM MECH // STUDY HUB</h1>
        <div class="hud-sub">&gt; SELECT A COURSE FOLDER TO LAUNCH INTERACTIVE NOTES_</div>
      </div>
      <div class="hud-stats">
        <div class="stat-badge" id="questCount">NOTES: 1</div>
        <div class="stat-badge" id="bossCount">EXAMS: 0</div>
      </div>
    </header>

    <div class="main-layout">
      <!-- LEFT COLUMN: COURSE FOLDERS -->
      <section class="pixel-box">
        <div class="section-header">📁 COURSE FOLDERS</div>

        <div class="folder-bar" id="folderBar">
          <button class="folder-btn active" onclick="selectFolder('all', this)">ALL</button>
          <button class="folder-btn" onclick="selectFolder('SEMM2123', this)">SEMM2123 (SOLIDS II)</button>
          <button class="folder-btn" onclick="selectFolder('SEMM2223', this)">SEMM2223 (VIBRATION)</button>
          <button class="folder-btn" onclick="selectFolder('SEMM2313', this)">SEMM2313 (FLUIDS I)</button>
          <button class="folder-btn" onclick="selectFolder('SEMM2413', this)">SEMM2413 (THERMO)</button>
          <button class="folder-btn" onclick="selectFolder('SEMM2613', this)">SEMM2613 (MATERIALS)</button>
        </div>

        <input type="text" class="pixel-input" id="searchInput" placeholder="> Search topic or keyword..." onkeyup="filterQuests()" />

        <div class="quest-grid" id="questGrid">
          
          <!-- ========================================================== -->
          <!-- HOW TO ADD A NEW NOTE:                                     -->
          <!-- 1. Upload your .html file to GitHub (e.g. thermo-ch1.html) -->
          <!-- 2. Copy one <a> block below and paste it right here        -->
          <!-- 3. Change href="...", data-folder="...", and the text!     -->
          <!-- ========================================================== -->

          <a href="topic8-vibration.html" class="quest-card" data-folder="SEMM2223">
            <span class="quest-tag">SEMM2223 • TOPIC 8</span>
            <h3>1DOF &amp; 2DOF VIBRATION</h3>
            <p>Free undamped vs. damped graphs, mode shapes, and equivalent system solver.</p>
          </a>

        </div>
      </section>

      <!-- RIGHT COLUMN: EXAM CALENDAR -->
      <aside class="pixel-box cal-box">
        <div class="section-header" style="color: var(--magenta);">⚔️ EXAM &amp; TEST LOG</div>

        <div class="cal-nav">
          <button onclick="changeMonth(-1)">&lt;</button>
          <span class="cal-month-label" id="calMonthLabel">MONTH YEAR</span>
          <button onclick="changeMonth(1)">&gt;</button>
        </div>

        <div class="cal-weekdays">
          <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
        </div>
        <div class="cal-days" id="calDays"></div>

        <!-- ADD EXAM / TEST -->
        <div class="event-form">
          <input type="date" id="eventDate" />
          <input type="text" id="eventTitle" placeholder="e.g., SEMM2413 Thermo Test 1" />
          <button class="add-btn" onclick="addEvent()">+ ADD EXAM DATE</button>
        </div>

        <!-- UPCOMING EXAMS LIST -->
        <div class="event-list" id="eventList"></div>
      </aside>
    </div>
  </div>

  <script>
    // --- COURSE FOLDER FILTERING ---
    let activeFolder = 'all';

    function selectFolder(folder, btn) {
      activeFolder = folder;
      document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterQuests();
    }

    function filterQuests() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.quest-card');
      cards.forEach(card => {
        const folderMatch = activeFolder === 'all' || card.dataset.folder === activeFolder;
        const textMatch = card.innerText.toLowerCase().includes(q);
        card.style.display = (folderMatch && textMatch) ? 'block' : 'none';
      });
      document.getElementById('questCount').textContent = `NOTES: ${cards.length}`;
    }

    // --- EXAM CALENDAR ---
    let currentDate = new Date();
    let selectedDateStr = formatDateISO(new Date());
    let events = JSON.parse(localStorage.getItem('utmExamCalendar')) || [];

    document.getElementById('eventDate').value = selectedDateStr;

    function formatDateISO(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveEvents() {
      localStorage.setItem('utmExamCalendar', JSON.stringify(events));
      renderCalendar();
      renderEventList();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      document.getElementById('calMonthLabel').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDateISO(new Date());

      const grid = document.getElementById('calDays');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = d;

        if (dateStr === todayStr) cell.classList.add('today');
        if (dateStr === selectedDateStr) cell.classList.add('selected');
        if (events.some(ev => ev.date === dateStr)) cell.classList.add('has-event');

        cell.onclick = () => {
          selectedDateStr = dateStr;
          document.getElementById('eventDate').value = dateStr;
          renderCalendar();
        };
        grid.appendChild(cell);
      }
    }

    function addEvent() {
      const date = document.getElementById('eventDate').value;
      const title = document.getElementById('eventTitle').value.trim();
      if (!date || !title) {
        alert('Please select a date and enter the exam name!');
        return;
      }
      events.push({ id: Date.now(), date, title });
      document.getElementById('eventTitle').value = '';
      saveEvents();
    }

    function deleteEvent(id) {
      events = events.filter(ev => ev.id !== id);
      saveEvents();
    }

    function renderEventList() {
      const list = document.getElementById('eventList');
      list.innerHTML = '';
      const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
      document.getElementById('bossCount').textContent = `EXAMS: ${sorted.length}`;

      if (sorted.length === 0) {
        list.innerHTML = '<div style="color: var(--muted); text-align:center; padding:10px;">No exams scheduled yet.</div>';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      sorted.forEach(ev => {
        const evDate = new Date(ev.date + 'T00:00:00');
        const diffDays = Math.round((evDate - today) / 86400000);
        let badge = diffDays === 0 ? 'TODAY!' : (diffDays > 0 ? `IN ${diffDays}D` : 'DONE');

        const item = document.createElement('div');
        item.className = 'event-item';
        item.innerHTML = `
          <div>
            <div class="event-meta">${ev.date} • ${badge}</div>
            <div class="event-title">${ev.title}</div>
          </div>
          <button class="del-btn" onclick="deleteEvent(${ev.id})">X</button>
        `;
        list.appendChild(item);
      });
    }

    filterQuests();
    renderCalendar();
    renderEventList();
  </script>
</body>
</html>
