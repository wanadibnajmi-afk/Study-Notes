  <style>
    :root {
      --bg: #0b0c10;
      --panel: #141622;
      --panel-alt: #1c1f30;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --cyan: #00f0ff;
      --green: #39ff14;
      --gold: #ffd700;
      --magenta: #ff2a85;
      --border: #2e344e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      line-height: 1.4;
      padding: 20px 14px 60px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 999;
    }

    .container { max-width: 1120px; margin: 0 auto; }

    .pixel-box {
      background: var(--panel);
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0px #000000;
      padding: 18px;
      margin-bottom: 22px;
    }

    /* Header HUD */
    header.hud {
      border-color: var(--cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hud-title h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 2.6vw, 1.4rem);
      color: var(--cyan);
      text-shadow: 3px 3px 0px #004455;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .hud-sub { color: var(--green); font-size: 1.2rem; }

    .hud-stats { display: flex; gap: 12px; flex-wrap: wrap; }

    .stat-badge {
      background: var(--panel-alt);
      border: 2px solid var(--gold);
      padding: 8px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: var(--gold);
      box-shadow: 3px 3px 0 #000;
    }

    /* Layout Grid */
    .main-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .section-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 16px;
      text-shadow: 2px 2px 0 #000;
    }

    /* Course Folder Tabs */
    .folder-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .folder-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      background: var(--panel-alt);
      color: var(--muted);
      border: 2px solid var(--border);
      padding: 9px 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
    }

    .folder-btn.active {
      background: var(--cyan);
      color: #000;
      border-color: #fff;
    }

    .pixel-input {
      width: 100%;
      background: #08090d;
      border: 2px solid var(--cyan);
      color: var(--green);
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      padding: 10px 12px;
      margin-bottom: 18px;
      outline: none;
    }

    /* Quest Cards Grid */
    .quest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .quest-card {
      display: block;
      text-decoration: none;
      background: var(--panel-alt);
      border: 3px solid var(--border);
      padding: 16px;
      color: var(--text);
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s, border-color 0.1s;
    }

    .quest-card:hover {
      border-color: var(--green);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .quest-tag {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      background: #08090d;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 4px 7px;
      margin-bottom: 10px;
    }

    .quest-card h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.76rem;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .quest-card p { color: var(--muted); font-size: 1.15rem; }

    /* Calendar Styling */
    .cal-box { border-color: var(--magenta); }

    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: var(--panel-alt);
      padding: 8px 10px;
      border: 2px solid var(--border);
    }

    .cal-nav button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      background: var(--magenta);
      color: #fff;
      border: 2px solid #fff;
      padding: 6px 10px;
      cursor: pointer;
    }

    .cal-month-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #fff;
    }
